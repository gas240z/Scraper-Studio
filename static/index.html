<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scraper Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0c1220;--panel:#141d30;--p2:#1a2540;--line:#26334f;--ink:#e9eef8;--mute:#8e9bb3;--acc:#6db4ff;--acc-ink:#04111f;--hot:#ffb36b;--err:#ff8f7e;--glow:rgba(109,180,255,.32);--ease:cubic-bezier(.22,.8,.24,1)}
[data-theme=light]{color-scheme:light;--bg:#edf1f8;--panel:#fff;--p2:#f1f4fa;--line:#d6deed;--ink:#142039;--mute:#5d6b86;--acc:#1f6fe5;--acc-ink:#fff;--hot:#c4620a;--err:#c0392b;--glow:rgba(31,111,229,.26)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Onest,"Segoe UI",system-ui,sans-serif;transition:background .5s,color .5s;
 background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0,transparent 20%,var(--bg) 75%);pointer-events:none}
.wrap{position:relative;max-width:1200px;margin:0 auto;padding:22px 20px 70px}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.o{animation:up .8s var(--ease) both;animation-delay:var(--d,0s)}
header{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo svg{width:30px;height:30px}.logo .dot{animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.ib{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease),border-color .3s}
.ib:hover{border-color:var(--acc);transform:rotate(18deg)}.ib svg{width:18px;height:18px}
h1{font:700 clamp(30px,5vw,52px)/1.08 Onest,sans-serif;letter-spacing:-.03em;margin:44px 0 10px;max-width:15em}
.lead{color:var(--mute);font-size:17px;margin:0 0 28px;max-width:34em}
.sw{position:relative;display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;max-width:100%}
.sw button{position:relative;z-index:1;background:none;border:0;color:var(--mute);font:500 14px Onest,sans-serif;padding:9px 16px;border-radius:9px;cursor:pointer;transition:color .3s;white-space:nowrap}
.sw button[aria-pressed=true]{color:var(--acc-ink)}
.sw .thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:0;background:var(--acc);border-radius:9px;transition:transform .45s var(--ease),width .45s var(--ease);box-shadow:0 4px 18px var(--glow)}
.sw.alt button[aria-pressed=true]{color:var(--ink)}.sw.alt .thumb{background:var(--p2);box-shadow:none;border:1px solid var(--line)}
.work{display:grid;gap:20px;margin-top:22px;align-items:start}
@media(min-width:960px){.work{grid-template-columns:minmax(330px,420px) 1fr}.side{position:sticky;top:18px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;transition:background .5s,border-color .5s}
.pane{display:none}.pane.on{display:block;animation:up .5s var(--ease)}
label,.lbl{display:block;font-size:13px;color:var(--mute);margin:0 0 6px}
input[type=url],input[type=text],input[type=number],input[type=search],select{width:100%;font:inherit;color:var(--ink);background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .25s,box-shadow .25s}
input:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px var(--glow)}
button:focus-visible,.drop:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.g{margin-bottom:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--mute);margin:8px 0 0;min-height:20px}
.adv{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}.adv.open{grid-template-rows:1fr}
.adv>div{overflow:hidden;padding:0 3px}.adv.open>div{padding:2px 3px 0}
.chk{display:flex;align-items:center;gap:9px;color:var(--ink);font-size:14px;cursor:pointer;margin:0}
.chk input{accent-color:var(--acc);width:17px;height:17px}
.go{position:relative;width:100%;background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:13px 20px;font:600 15px Onest,sans-serif;cursor:pointer;transition:transform .25s var(--ease),box-shadow .3s;box-shadow:0 6px 24px var(--glow)}
.go:hover{transform:translateY(-2px);box-shadow:0 10px 30px var(--glow)}.go:active{transform:scale(.98)}
.go:disabled{cursor:progress;transform:none}.go .sp{display:none;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:9px;vertical-align:-2px;animation:spin .7s linear infinite}
.go:disabled .sp{display:inline-block}@keyframes spin{to{transform:rotate(1turn)}}
.kbd{font:12px "JetBrains Mono",monospace;opacity:.6;margin-left:8px}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:26px 14px;border:1.5px dashed var(--line);border-radius:14px;color:var(--mute);cursor:pointer;margin:0 0 14px;transition:border-color .3s,background .3s,transform .3s var(--ease)}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--p2)}.drop.over{transform:scale(1.015)}
.drop svg{width:34px;height:34px;color:var(--acc);transition:transform .5s var(--ease)}.drop:hover svg{transform:translateY(-4px)}
.drop b{color:var(--ink);font-weight:600}.drop img{max-width:100%;max-height:150px;border-radius:8px;animation:up .5s var(--ease)}
.drop .fn{color:var(--ink);font-weight:500;word-break:break-all;animation:up .5s var(--ease)}
.hist{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;max-width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:5px 12px;font:13px Onest,sans-serif;cursor:pointer;transition:border-color .25s,transform .25s var(--ease);animation:up .4s var(--ease)}
.chip:hover{border-color:var(--acc);transform:translateY(-2px)}.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.chip i{font-style:normal;color:var(--hot);font-weight:600}
.res{min-height:460px;position:relative;overflow:hidden}
.empty{display:grid;place-items:center;text-align:center;color:var(--mute);min-height:420px;gap:6px;align-content:center}
.empty .ln{height:9px;border-radius:5px;background:var(--p2);margin:7px auto;animation:pulse 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes pulse{50%{opacity:.35}}
.busy{min-height:420px;position:relative}.busy h3{margin:0 0 18px;font-size:17px;animation:up .4s var(--ease)}
.sk{height:11px;border-radius:6px;background:var(--p2);margin:0 0 11px}
.beam{position:absolute;left:-20px;right:-20px;height:90px;top:-90px;background:linear-gradient(transparent,var(--glow));border-bottom:2px solid var(--acc);animation:beam 1.9s var(--ease) infinite}
@keyframes beam{to{top:100%}}
.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;animation:up .5s var(--ease)}
.head h2{margin:0;font-size:20px;letter-spacing:-.01em;word-break:break-word}.src{margin:2px 0 0;color:var(--mute);font-size:13px;word-break:break-all}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.sm{background:var(--p2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font:500 13px Onest,sans-serif;cursor:pointer;transition:border-color .25s,transform .25s var(--ease)}
.sm:hover{border-color:var(--acc);transform:translateY(-1px)}.sm[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.st{flex:1;min-width:92px;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;animation:up .6s var(--ease) both;animation-delay:var(--d)}
.st b{display:block;font:600 22px/1.2 "JetBrains Mono",monospace;letter-spacing:-.03em}.st span{font-size:12px;color:var(--mute)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.tools input{flex:1;min-width:150px;width:auto}
.body{animation:up .45s var(--ease)}
.code{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px 0;max-height:540px;overflow:auto;font:13px/1.65 "JetBrains Mono",monospace}
.code.nw .t{white-space:pre;}
.l{display:flex;gap:14px;padding:0 14px;animation:up .5s var(--ease) both;animation-delay:calc(var(--i,30)*22ms)}.l:hover{background:var(--glow)}
.n{flex:none;min-width:34px;text-align:right;color:var(--mute);opacity:.6;user-select:none}.t{white-space:pre-wrap;word-break:break-word}
mark{background:var(--hot);color:#111;border-radius:3px;padding:0 2px}
.lk{list-style:none;margin:0;padding:0;max-height:540px;overflow:auto}
.lk li{display:flex;gap:12px;align-items:baseline;padding:9px 4px;border-bottom:1px solid var(--line);animation:up .45s var(--ease) both;animation-delay:calc(var(--i,20)*20ms)}
.lk a{color:var(--acc);text-decoration:none;word-break:break-all}.lk a:hover{text-decoration:underline}.lk small{color:var(--mute);margin-left:auto;flex:none;font:12px "JetBrains Mono",monospace}
.tb{overflow:auto;max-height:540px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:first-child td{background:var(--p2);font-weight:600;position:sticky;top:0}tbody tr:hover td{background:var(--glow)}
.cap{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;color:var(--mute);font-size:13px}
.note{color:var(--mute);padding:30px;text-align:center}.err{color:var(--err);font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin-bottom:14px}
.pc{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;animation:up .55s var(--ease) both;animation-delay:var(--d)}
.pc>span{font-size:12px;color:var(--mute)}.pc b{display:block;font:600 23px/1.3 "JetBrains Mono",monospace;letter-spacing:-.03em}
.pc em{display:block;font-style:normal;font-size:13px;margin:0 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc small{display:block;font:12px "JetBrains Mono",monospace;color:var(--acc)}
.pc.lo{border-color:#4cc38a}.pc.hi{border-color:var(--hot)}
.ptools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.ptools select,.ptools input{width:auto;flex:1;min-width:120px}
.pt{border-collapse:collapse}.pt thead th{position:sticky;top:0;background:var(--p2);font-weight:600;z-index:1}.pt tr:first-child td{background:none;font-weight:400;position:static}
.pt td.nm{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pt td.v{font-family:"JetBrains Mono",monospace;white-space:nowrap}
.pt tr.mn td{background:rgba(76,195,138,.16)}.pt tr.mx td{background:rgba(255,179,107,.18)}
.tag{font:600 11px Onest,sans-serif;border-radius:6px;padding:1px 6px;margin-left:6px;color:#111;background:#4cc38a}.tag.h{background:var(--hot)}
.hb{display:grid;grid-template-columns:140px 1fr 30px;gap:10px;align-items:center;font:12px "JetBrains Mono",monospace;color:var(--mute);margin:6px 0}
.hb i{display:block;height:10px;border-radius:5px;background:var(--acc);width:0;transition:width .9s var(--ease)}
.sec{margin:18px 0 6px;font-weight:600}.conv{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.conv input,.conv select{width:130px}.conv output{font:13px "JetBrains Mono",monospace;color:var(--acc)}
.cl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.cl .chip{text-decoration:none}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,90px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:500;transition:transform .5s var(--ease);z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="o">
  <div class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6H7v20h4M21 6h4v20h-4"/><circle class="dot" cx="16" cy="16" r="2.6" fill="var(--hot)" stroke="none"/></svg>Scraper Studio</div>
  <button class="ib" id="theme" aria-label="Сменить тему"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>
<h1 class="o" style="--d:.08s">Достаньте текст из сайта, PDF или фотографии</h1>
<p class="lead o" style="--d:.16s">Выберите источник, и результат появится справа: с поиском, таблицами, ссылками и выгрузкой в файл.</p>
<div class="sw o" id="tabs" style="--d:.24s"><button data-v="site" aria-pressed="true">Сайт</button><button data-v="pdf" aria-pressed="false">PDF</button><button data-v="ocr" aria-pressed="false">Картинка (OCR)</button></div>

<div class="work o" style="--d:.32s">
<div class="side">
 <div class="panel">
  <div class="pane on" id="p-site">
   <div class="g"><label for="url">Ссылка на страницу</label><input id="url" type="url" placeholder="https://example.com" value="https://example.com"></div>
   <div class="g"><span class="lbl">Движок</span><div class="sw alt" id="eng"><button data-v="bs4" aria-pressed="true">BeautifulSoup</button><button data-v="selenium" aria-pressed="false">Selenium</button></div><p class="hint" id="eh">Быстрый разбор HTML: подходит для обычных страниц.</p></div>
   <div class="g"><label for="sel">Что достать: CSS-селектор (необязательно)</label><input id="sel" type="text" autocomplete="off" spellcheck="false" placeholder="пусто = весь текст страницы"><div class="hist" id="presets" style="margin-top:8px"><button class="chip" data-s="h1, h2, h3">Заголовки</button><button class="chip" data-s="p">Абзацы</button><button class="chip" data-s="a">Ссылки</button><button class="chip" data-s="li">Списки</button></div></div>
   <div class="adv" id="adv"><div>
    <div class="two g"><div><label for="wsel">Ждать элемент</label><input id="wsel" type="text" autocomplete="off" spellcheck="false" placeholder="#content"></div><div><label for="to">Таймаут, сек</label><input id="to" type="number" min="5" max="120" value="20"></div></div>
    <label class="chk g"><input type="checkbox" id="hl" checked>Без окна браузера</label>
   </div></div>
   <button class="go" data-run="site"><span class="sp"></span><span class="tx">Собрать данные</span><span class="kbd">Ctrl+Enter</span></button>
  </div>
  <div class="pane" id="p-pdf">
   <label class="drop" id="dz-pdf" for="f-pdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14h6M9 17h4"/></svg><span class="dt"><b>Выберите PDF</b> или перетащите сюда</span></label>
   <input type="file" id="f-pdf" accept="application/pdf" hidden>
   <div class="g"><label for="l-pdf">Язык для распознавания сканов</label><select id="l-pdf"><option value="rus+eng">Русский + English</option><option value="eng">English</option><option value="rus">Русский</option></select></div>
   <label class="chk g"><input type="checkbox" id="o-pdf" checked>Распознавать страницы-сканы</label>
   <button class="go" data-run="pdf"><span class="sp"></span><span class="tx">Прочитать PDF</span><span class="kbd">Ctrl+Enter</span></button>
  </div>
  <div class="pane" id="p-ocr">
   <label class="drop" id="dz-ocr" for="f-ocr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-8 8"/></svg><span class="dt"><b>Выберите изображение</b>, перетащите или вставьте Ctrl+V</span></label>
   <input type="file" id="f-ocr" accept="image/*" hidden>
   <div class="g"><label for="l-ocr">Язык текста</label><select id="l-ocr"><option value="rus+eng">Русский + English</option><option value="eng">English</option><option value="rus">Русский</option></select></div>
   <button class="go" data-run="ocr"><span class="sp"></span><span class="tx">Распознать текст</span><span class="kbd">Ctrl+Enter</span></button>
  </div>
 </div>
 <div class="hist" id="hist"></div>
</div>

<section class="panel res" id="res" aria-live="polite">
 <div class="empty" id="empty"><div style="width:100%;max-width:300px"><div class="ln" style="--d:0s;width:90%"></div><div class="ln" style="--d:.3s;width:70%"></div><div class="ln" style="--d:.6s;width:84%"></div><div class="ln" style="--d:.9s;width:48%"></div></div><b style="color:var(--ink);font-size:17px;margin-top:14px">Здесь появится результат</b><span>Укажите источник слева и нажмите кнопку.</span></div>
 <div class="busy" id="busy" hidden><div class="beam"></div><h3 id="bt"></h3><div id="sks"></div></div>
 <div id="done" hidden>
  <div class="head"><div><h2 id="rt"></h2><p class="src" id="rs"></p></div>
   <div class="acts"><button class="sm" id="cp">Копировать</button><button class="sm" id="dtx">.txt</button><button class="sm" id="djs">.json</button></div></div>
  <div class="stats" id="stats"></div>
  <div class="tools"><div class="sw alt" id="views"></div><input type="search" id="q" placeholder="Поиск по результату"><button class="sm" id="wr" aria-pressed="true">Перенос строк</button></div>
  <div id="body"></div>
 </div>
</section>
</div>
</div>
<div id="toast" role="status"></div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let cur=null,view='text',kind='site',timer;

/* переключатели с «плавающей» подсветкой */
function sw(box,onPick){
  let th=$('.thumb',box)||box.insertBefore(el('i','thumb'),box.firstChild);
  const bs=$$('button',box),place=()=>{const a=bs.find(b=>b.getAttribute('aria-pressed')==='true');if(a){th.style.width=a.offsetWidth+'px';th.style.transform=`translateX(${a.offsetLeft}px)`}};
  bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.setAttribute('aria-pressed',x===b));place();onPick&&onPick(b.dataset.v)});
  place();addEventListener('resize',place);document.fonts?.ready.then(place);
}
sw($('#tabs'),v=>{kind=v;$$('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+v))});
sw($('#eng'),v=>{$('#adv').classList.toggle('open',v==='selenium');
  $('#eh').textContent=v==='selenium'?'Запускает Chrome: для страниц, где контент подгружает JavaScript.':'Быстрый разбор HTML: подходит для обычных страниц.'});

/* тема */
const setTheme=t=>{document.documentElement.dataset.theme=t;store.set('ss_theme',t)};
setTheme(store.get('ss_theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'));
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('on'),2000)}
const fmt=n=>n<1024?n+' Б':n<1048576?(n/1024).toFixed(1)+' КБ':(n/1048576).toFixed(1)+' МБ';

/* файлы: выбор, drag&drop, вставка */
function setFile(k,f){
  if(!f)return;const dz=$('#dz-'+k),dt=new DataTransfer();dt.items.add(f);$('#f-'+k).files=dt.files;
  $$('img,.fn',dz).forEach(x=>x.remove());$('svg',dz).hidden=!!f.type.startsWith('image/');
  if(f.type.startsWith('image/')){const i=el('img');i.src=URL.createObjectURL(f);dz.insertBefore(i,$('.dt',dz))}

const STEPS={site:['Подключаюсь к сайту','Загружаю страницу','Разбираю HTML','Собираю текст и ссылки'],pdf:['Открываю документ','Читаю страницы','Ищу сканы','Распознаю текст'],ocr:['Готовлю изображение','Ищу строки текста','Распознаю символы']};

async function run(k){

function count(node,to){const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700);node.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString('ru');if(p<1)requestAnimationFrame(f)})(t0)}

  const txt=d.text||'',S=[['символов',txt.length],['слов',(txt.match(/\S+/g)||[]).length],['строк',txt?txt.split('\n').length:0]];
  if(d.page_count)S.push(['страниц',d.page_count]);if(d.ocr_pages)S.push(['страниц с OCR',d.ocr_pages]);

  const st=$('#stats');st.innerHTML='';S.forEach(([l,v],i)=>{const c=el('div','st');c.style.setProperty('--d',i*.07+'s');const b=el('b','','0');c.append(b,el('span','',l));st.append(c);count(b,v)});
  const vs=$('#views');vs.innerHTML='';[['text','Текст'],d.prices?.length&&['prices','Цены'],(d.contacts?.emails.length||d.contacts?.phones.length)&&['contacts','Контакты'],d.links?.length&&['links','Ссылки'],d.tables?.length&&['tables','Таблицы'],txt.length>200&&['words','Слова'],['json','JSON']].filter(Boolean).forEach(([v,n])=>{const b=el('button','',n);b.dataset.v=v;b.setAttribute('aria-pressed',v===view);vs.append(b)});

const hl=(n,s,q)=>{let i=0,lo=s.toLowerCase();for(;;){const j=q?lo.indexOf(q,i):-1;if(j<0){n.append(s.slice(i));return}n.append(s.slice(i,j),el('mark','',s.slice(j,j+q.length)));i=j+q.length}};

let psort='asc',plo='',phi='',cvA='100',cvC='USD';

const trio=it=>mny(it.usd,'USD')+'  |  '+mny(it.eur,'EUR')+'  |  '+mny(it.azn,'AZN');
function pricesView(b,d,q){

  if(S.min_i!=null){const g=el('div','pgrid');let i=0;
    const card=(t,main,name,sub,c)=>{const x=el('div','pc'+(c?' '+c:''));x.style.setProperty('--d',i++*.07+'s');x.append(el('span','',t),el('b','',main),el('em','',name||' '),el('small','',sub));g.append(x)};

    card('Средняя цена',mny(S.avg_usd,'USD'),'',mny(S.avg_eur,'EUR')+'  |  '+mny(S.avg_azn,'AZN'));

  let rows=P.map((it,i)=>({...it,i})).filter(it=>(!q||(it.name+it.raw).toLowerCase().includes(q))&&(!plo||(it.usd!=null&&it.usd>=+plo))&&(!phi||(it.usd!=null&&it.usd<=+phi)));
  rows.sort((x,y)=>psort==='name'?x.name.localeCompare(y.name):((x.usd??1e18)-(y.usd??1e18))*(psort==='asc'?1:-1));
  if(!rows.length)return b.append(el('p','note','По этим условиям ничего не найдено'));
  const w=el('div','tb'),tb=el('table','pt'),th=el('thead'),hr=el('tr');['Товар','На сайте','USD','EUR','AZN'].forEach(h=>hr.append(el('th','',h)));th.append(hr);tb.append(th);
  const tbd=el('tbody');rows.slice(0,300).forEach(it=>{const tr=el('tr',it.i===S.min_i?'mn':it.i===S.max_i?'mx':'');const n=el('td','nm');
    if(it.url){const l=el('a','',it.name||'(без названия)');l.href=it.url;l.target='_blank';l.rel='noopener';l.style.color='var(--acc)';n.append(l)}else n.textContent=it.name||'(без названия)';
    if(it.i===S.min_i)n.append(el('span','tag','мин'));if(it.i===S.max_i)n.append(el('span','tag h','макс'));
    tr.append(n,el('td','v',it.raw),...['usd','eur','azn'].map(k=>el('td','v',it[k]==null?'-':mny(it[k],k.toUpperCase()))));tbd.append(tr)});

    U.forEach(v=>bins[Math.min(n-1,Math.floor((v-mn)/st))]++);const top=Math.max(...bins),bars=[];
    bins.forEach((c,i)=>{const r=el('div','hb'),bar=el('i');bar.dataset.w=c/top*100;bars.push(bar);r.append(el('span','',`$${(mn+i*st).toFixed(0)}-${(mn+(i+1)*st).toFixed(0)}`),bar,el('span','',c));b.append(r)});
    setTimeout(()=>bars.forEach(x=>x.style.width=x.dataset.w+'%'),60)}
  b.append(el('div','sec','Конвертер'));const cv=el('div','conv'),ci=el('input'),cs=el('select'),co=el('output');ci.type='number';ci.value=cvA;

  const rate=c=>c==='USD'?1:R[c],calc=()=>{cvA=ci.value;cvC=cs.value;const u=(+ci.value||0)/rate(cvC);co.textContent=`= ${mny(u,'USD')}  |  ${mny(u*R.EUR,'EUR')}  |  ${mny(u*R.AZN,'AZN')}`};
  ci.oninput=cs.onchange=calc;calc();cv.append(ci,cs,co);b.append(cv);
  const f=el('p','hint',`Курс: 1 USD = ${R.EUR?.toFixed(3)} EUR = ${R.AZN?.toFixed(3)} AZN. Источник: ${S.source}${S.updated?', '+S.updated:''}.`);b.append(f);
  const ex=el('button','sm','Скачать цены (CSV)');ex.style.marginTop='8px';
  ex.onclick=()=>dl('\ufeff'+['Товар;Цена на сайте;Валюта;Сумма;USD;EUR;AZN;Ссылка',...rows.map(r=>[r.name,r.raw,r.currency,r.amount,r.usd,r.eur,r.azn,r.url].map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';'))].join('\n'),'prices.csv','text/csv');b.append(ex);
}
function contactsView(b,d,q){
  const C=d.contacts,mk=(t,arr,mail)=>{arr=arr.filter(x=>!q||x.toLowerCase().includes(q));if(!arr.length)return;b.append(el('div','sec',t));const cl=el('div','cl');

function wordsView(b,d){
  const stop=new Set('this that with from have your will been were they their there which what when about также этот этого этой более было быть были была если только после перед между чтобы очень можно который которые которой'.split(' ')),m={};
